[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-ui"
version = "0.1.0"
description = "A reusable screen map and verified workflow MCP for computer-use agents"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Synx"}]
dependencies = []

[project.scripts]
pulse-mcp = "pulse.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
